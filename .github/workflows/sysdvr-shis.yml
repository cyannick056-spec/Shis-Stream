name: Build SysDVR SHIS Direct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sysdvr-shis/**'
      - '.github/workflows/sysdvr-shis.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned SysDVR 6.3 source
        shell: bash
        run: |
          git clone https://github.com/exelix11/SysDVR.git upstream
          cd upstream
          git checkout 804fd36e54983b7c76b249059b159f896af35b4d

      - name: Install SHIS direct transport
        shell: bash
        run: |
          cp sysdvr-shis/TCPmode.c upstream/sysmodule/source/modes/TCPmode.c
          patch upstream/sysmodule/source/modes/TCPmode.c < sysdvr-shis/anti-jitter-v07.patch
          printf '\nint g_tcpEnableBroadcast = 0;\n' >> upstream/sysmodule/source/modes/TCPmode.c

      - name: Build SysDVR SHIS sysmodule
        shell: bash
        run: |
          make -C upstream/sysmodule clean
          make -C upstream/sysmodule -j2
          strings upstream/sysmodule/sysmodule.nsp | grep 'SYSDVR_BUILD_FULL'

      - name: Package test build
        shell: bash
        run: |
          set -eux
          OUT=release
          rm -rf "$OUT"
          mkdir -p "$OUT/atmosphere/contents/00FF0000A53BB665/flags"
          mkdir -p "$OUT/config/sysdvr"
          cp upstream/sysmodule/sysmodule.nsp "$OUT/atmosphere/contents/00FF0000A53BB665/exefs.nsp"
          cp upstream/sysmodule/toolbox.json "$OUT/atmosphere/contents/00FF0000A53BB665/toolbox.json"
          touch "$OUT/atmosphere/contents/00FF0000A53BB665/flags/boot2.flag"
          touch "$OUT/config/sysdvr/tcp"
          cat > "$OUT/config/sysdvr/shis.ini" <<'EOF'
          relay_host=YOUR_RELAY_HOST
          relay_port=YOUR_RELAY_PORT
          stream=cris
          stream_key=YOUR_STREAM_KEY
          EOF
          cat > "$OUT/LEEME_SHIS_SYSDVR.txt" <<'EOF'
          SysDVR-SHIS Direct v0.7 anti-jitter experimental.

          Includes:
          - Direct H.264 video + PCM16 audio to SHIS relay.
          - Dedicated network sender thread: GRC video capture never waits for Railway.
          - Six-slot static video queue cushions about 200 ms of brief TCP/Wi-Fi stalls at 30 fps.
          - Larger TCP send buffer absorbs short uplink stalls before the capture queue overflows.
          - Video gets strict priority over queued PCM when both are waiting; audio can recover independently but a missing H.264 reference frame cannot.
          - Capture threads only queue frames; a single sender writes audio and video without holding the capture state lock through network waits.
          - If network backpressure still drops a referenced frame, dependent P-frames are discarded until the next IDR instead of corrupting the picture.
          - Invalid/oversized capture packets also force a clean IDR recovery.
          - Relay socket is switched to non-blocking mode after authentication.
          - SPS/PPS injection remains enabled.

          The normal TCP mode is temporarily replaced by SHIS direct output.
          Do not run the old separate SHIS Forwarder with this build.
          Restore the official SysDVR exefs.nsp to return to normal TCP mode.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SysDVR-SHIS-Direct-v0.7-anti-jitter
          path: release/**