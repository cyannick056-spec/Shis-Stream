# SHIS Forwarder v0.2 Safe
# The real relay_host and relay_port are assigned by Railway TCP Proxy.
# enabled=0 keeps the sysmodule dormant without opening network sockets.
enabled=0
relay_host=YOUR_RELAY_HOST
relay_port=YOUR_RELAY_PORT
stream=cris
stream_key=YOUR_STREAM_KEY
# First stability tests should be video-only. Set audio=1 after video is stable.
audio=0
